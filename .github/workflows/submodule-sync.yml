# 子仓库定时同步工作流
# 每周自动更新所有子仓库到最新版本，并生成同步报告

name: Submodule Sync

on:
  schedule:
    # 每周一早上 8:00 自动同步
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      target_submodule:
        description: '指定子模块 (留空则全部)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 获取所有子模块信息
        id: submodules
        run: |
          git submodule status > submodule-status.txt
          git submodule status | awk '{print $2}' > submodule-paths.txt

      - name: 初始化所有子模块
        run: git submodule init

      - name: 同步到最新远程
        env:
          TARGET: ${{ github.event.inputs.target_submodule }}
        run: |
          if [[ -n "$TARGET" ]]; then
            echo "同步指定子模块: $TARGET"
            git submodule update --remote --force "$TARGET"
          else
            echo "同步所有子模块"
            git submodule update --remote --recursive
          fi

      - name: 生成同步报告
        run: |
          echo '# 🔄 子仓库同步报告' > submodule-sync-report.md
          echo '' >> submodule-sync-report.md
          echo '**同步时间**: $(date -u '"'"'+%Y-%m-%d %H:%M:%S UTC'"'"')' >> submodule-sync-report.md
          echo '**触发方式**: ${{ github.event_name == '"'"'schedule'"'"' && '"'"'定时任务'"'"' || '"'"'手动触发'"'"' }}' >> submodule-sync-report.md
          echo '' >> submodule-sync-report.md
          echo '## 同步结果' >> submodule-sync-report.md
          echo '' >> submodule-sync-report.md
          echo '| 子模块 | 当前版本 | 远程版本 | 状态 |' >> submodule-sync-report.md
          echo '|--------|----------|----------|------|' >> submodule-sync-report.md

          while IFS= read -r path; do
            if [[ -n "$path" ]] && [[ -d "$path" ]]; then
              cd "$path" 2>/dev/null || continue
              current=$(git rev-parse HEAD 2>/dev/null | cut -c1-7 || echo 'N/A')
              remote=$(git rev-parse origin/main 2>/dev/null | cut -c1-7) || \
                       remote=$(git rev-parse origin/master 2>/dev/null | cut -c1-7) || \
                       remote='N/A'
              cd - > /dev/null
              echo "| \`$path\` | \`$current\` | \`$remote\` | ✅ 已更新 |" >> submodule-sync-report.md
            fi
          done < submodule-paths.txt

          echo '' >> submodule-sync-report.md
          echo '---' >> submodule-sync-report.md
          echo '*由 GitHub Actions 自动生成*' >> submodule-sync-report.md

          cat submodule-sync-report.md

      - name: 检查变更
        id: check_changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No submodule updates found"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "发现需要更新的子模块"
            git diff --stat
          fi

      - name: 创建同步提交
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_commit
        run: |
          BRANCH="submodule-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore: sync submodules to latest

          - Updated submodules to latest remote versions
          - Generated by GitHub Actions submodule-sync workflow
          - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: 创建 PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.create_commit.outputs.branch }}"
          echo "使用分支: $BRANCH"

          # 创建 PR
          PR_URL=$(gh pr create \
            --repo adminlove520/multi-CyberSecurity \
            --head "$BRANCH" \
            --base main \
            --title "chore: sync submodules to latest" \
            --body "自动同步的子仓库更新" \
            --fill)

          echo "PR created: $PR_URL"

          # 自动创建 label（如果不存在）
          gh label create "submodule-update" \
            --description "子仓库同步更新" \
            --repo adminlove520/multi-CyberSecurity \
            2>/dev/null || echo "label 已存在"

          # 添加 label 到 PR
          gh pr edit "$PR_URL" --add-label "submodule-update"

      - name: 上传报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submodule-sync-report
          path: submodule-sync-report.md
          retention-days: 7

      - name: 无更新通知
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "✅ 所有子模块已是最新版本，无需更新"
