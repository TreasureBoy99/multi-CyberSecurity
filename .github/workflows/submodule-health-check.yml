# 子仓库健康检查工作流
# 检查所有子仓库是否可访问，检测 404/403 等异常

name: Submodule Health Check

on:
  schedule:
    # 每天早上 6:00 检查一次
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report: ${{ steps.check.outputs.report }}
      has_issues: ${{ steps.check.outputs.has_issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # 不需要 clone 只需要检查

      - name: Parse .gitmodules and check health
        id: check
        run: |
          REPORT=""
          HAS_ISSUES="false"

          while IFS='=' read -r key value; do
            # 解析 [submodule "path"] url = value
            if [[ "$key" =~ ^\[submodule\ \"([^\"]+)\"\]$ ]]; then
              current_path="${BASH_REMATCH[1]}"
              current_url=""
            elif [[ "$key" == "path" ]] && [[ -n "$current_path" ]]; then
              :
            elif [[ "$key" == "url" ]] && [[ -n "$current_path" ]]; then
              current_url="$value"
            elif [[ "$key" == "]" ]] && [[ -n "$current_path" && -n "$current_url" ]]; then
              # 检查这个子仓库
              echo "检查子仓库: $current_path ($current_url)"

              # 提取 host 和 path
              if [[ "$current_url" =~ github\.com[:/](.+)\.git$ ]] || [[ "$current_url" =~ github\.com/(.+)$ ]]; then
                repo_path="${BASH_REMATCH[1]}"
                api_url="https://api.github.com/repos/$repo_path"

                # 调用 GitHub API 检查状态
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$api_url")

                if [[ "$HTTP_CODE" == "200" ]]; then
                  echo "  ✅ 正常"
                  REPORT="${REPORT}✅ \`$current_path\` - 正常\n"
                elif [[ "$HTTP_CODE" == "404" ]]; then
                  echo "  ❌ 404 - 仓库不存在或已删除"
                  REPORT="${REPORT}❌ \`$current_path\` - 404 仓库不存在\n"
                  HAS_ISSUES="true"
                elif [[ "$HTTP_CODE" == "403" ]]; then
                  echo "  ⚠️ 403 - 访问被限制"
                  REPORT="${REPORT}⚠️ \`$current_path\` - 403 访问受限\n"
                  HAS_ISSUES="true"
                else
                  echo "  ⚠️ HTTP $HTTP_CODE"
                  REPORT="${REPORT}⚠️ \`$current_path\` - HTTP $HTTP_CODE\n"
                  HAS_ISSUES="true"
                fi
              fi

              current_path=""
              current_url=""
            fi
          done < .gitmodules

          echo "report=$REPORT" >> $GITHUB_OUTPUT
          echo "has_issues=$HAS_ISSUES" >> $GITHUB_OUTPUT

      - name: 生成健康报告
        if: always()
        run: |
          cat << 'EOF' > submodule-health-report.md
          # 🔍 子仓库健康检查报告

          **检查时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## 检查结果

          ${{ steps.check.outputs.report }}

          ## 异常仓库

          ${{ steps.check.outputs.has_issues == 'true' && '⚠️ 发现异常，请及时处理' || '✅ 所有仓库状态正常' }}

          ---
          *由 GitHub Actions 自动生成*
          EOF

      - name: 上传报告作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: submodule-health-report
          path: submodule-health-report.md
          retention-days: 30

      - name: 创建 Issue 记录异常
        if: steps.check.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('submodule-health-report.md', 'utf8');

            // 查找是否已有开启的 issue
            const existing = github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['submodule-health']
            });

            if (existing.data.length > 0) {
              // 更新已有 issue
              github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: report
              });
            } else {
              // 创建新 issue
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ 子仓库健康检查异常',
                body: report,
                labels: ['submodule-health']
              });
            }

      - name: 通知 (成功时)
        if: steps.check.outputs.has_issues != 'true'
        run: |
          echo "✅ 所有子仓库健康检查通过"
